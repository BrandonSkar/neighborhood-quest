<!doctype html>
<html>
<head><meta charset="utf-8">
<!-- App icon source. Render to PNG with headless Chrome (see gen-icons.cjs). -->
<style>
  html,body{margin:0;padding:0;overflow:hidden;}
  .icon{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 32%, #bfeaff 0%, #a6e08a 78%, #8fd873 100%);}
  .em{font-size:64vmin;line-height:1;filter:drop-shadow(0 3vmin 3vmin rgba(30,40,20,.28));}
</style></head>
<body><div class="icon"><span class="em">🦊</span></div></body>
</html>
